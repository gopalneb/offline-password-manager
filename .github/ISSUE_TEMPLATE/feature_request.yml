name: Feature request
description: Suggest a scoped improvement to Pocket Vault.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Describe any effect on stored credentials, permissions, Autofill, backups, or networking.
    validations:
      required: true
